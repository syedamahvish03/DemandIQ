services:
  - type: web
    name: demandiq-api
    runtime: python
    autoDeployTrigger: off
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DEMANDIQ_CORS_ORIGINS
        sync: false
      - key: DEMANDIQ_API_RATE_LIMIT_REQUESTS
        value: "30"
      - key: DEMANDIQ_API_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
